<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Profil-Platzhalter mit den Initialen MA">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2438"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="320" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="160" cy="160" r="118" fill="none" stroke="url(#ring)" stroke-width="4" opacity="0.6"/>
  <text x="160" y="160" fill="#e6ecf5" font-family="system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="132" font-weight="700" text-anchor="middle" dominant-baseline="central"
        letter-spacing="4">MA</text>
</svg>
